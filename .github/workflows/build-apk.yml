name: Build AudioAnchor APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get official AudioAnchor delete fix
        run: |
          git clone https://github.com/flackbash/AudioAnchor.git audioanchor
          cd audioanchor
          git checkout 88d480ccba76e67ae501fa64ab0674b43e8176c7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build APK
        working-directory: audioanchor
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioAnchor-2.6.0-delete-fix
          path: audioanchor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
